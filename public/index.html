<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaffer Brothers Group IT</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand-red:#E31B23;
  --brand-red-dark:#C01A20;
  --brand-black:#111111;
  --brand-grey:#707070;
  --ink:#111111;
  --ink-soft:#222222;
  --muted:#707070;
  --faint:#9A9A9A;
  --paper:#F7F7F7;
  --panel:#FFFFFF;
  --panel-2:#F0F0F0;
  --line:#E0E0E0;
  --line-soft:#ECECEC;
  --green:#0F7A3E;
  --green-dim:#E7F7ED;
  --amber:#C67A14;
  --amber-dim:#FBF0DC;
  --red-dim:#FCE8E9;
  --sky:#444444;
  --sky-dim:#EEEEEE;
  --shadow:0 1px 0 rgba(0,0,0,.04), 0 12px 36px rgba(0,0,0,.07);
  --radius:14px;
  --font:'Montserrat', 'Segoe UI', sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  color:var(--ink);
  font-family:var(--font);
  font-size:14px;
  line-height:1.45;
  background:
    radial-gradient(1200px 500px at 10% -10%, rgba(227,27,35,.07), transparent 55%),
    radial-gradient(900px 420px at 100% 0%, rgba(0,0,0,.04), transparent 50%),
    linear-gradient(180deg, #FFFFFF 0%, #F7F7F7 45%, #F3F3F3 100%);
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    linear-gradient(rgba(227,27,35,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(227,27,35,.03) 1px, transparent 1px);
  background-size:48px 48px;
  mask-image:linear-gradient(180deg, #000 0%, transparent 85%);
}
a{color:var(--brand-red)}
button,input,select,textarea{font:inherit}
.shell{position:relative;z-index:1;max-width:1480px;margin:0 auto;padding:22px 22px 72px}

.hero{
  position:relative;overflow:hidden;
  border-radius:16px;margin-bottom:18px;
  background:#fff;
  border:1px solid var(--line);
  border-top:4px solid var(--brand-red);
  box-shadow:var(--shadow);
  animation:rise .55s ease both;
}
.hero::before{
  content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;
  background:linear-gradient(135deg, rgba(227,27,35,.08), transparent 70%);
  transform:rotate(18deg);pointer-events:none;
}
.hero::after{
  content:"";position:absolute;left:0;bottom:0;right:0;height:3px;
  background:linear-gradient(90deg, var(--brand-red), transparent 55%);
  pointer-events:none;
}
.topbar{
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
  padding:18px 22px 16px;
}
.brand-mark{display:flex;align-items:center;gap:18px;min-width:min(100%,340px)}
.logo{flex-shrink:0;background:transparent;border:none;padding:0;display:block}
.logo img{display:block;height:52px;width:auto;max-width:min(280px,70vw);object-fit:contain}
.brand h1{
  margin:0;font-weight:800;
  font-size:clamp(22px,3.4vw,32px);
  letter-spacing:-.03em;line-height:1.05;color:var(--brand-black);
  text-transform:uppercase;text-wrap:balance;
}
.brand h1 .it{color:var(--brand-red)}
.brand p{
  margin:7px 0 0;color:var(--brand-grey);font-size:13px;font-weight:500;max-width:48ch;
}
.brand-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.live{
  display:inline-flex;align-items:center;gap:7px;
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--green);background:var(--green-dim);padding:4px 10px;border-radius:999px;
  border:1px solid rgba(15,122,62,.22);
}
.live i{
  width:7px;height:7px;border-radius:50%;background:#16A34A;
  box-shadow:0 0 0 0 rgba(22,163,74,.45);animation:pulse 1.8s ease infinite;
}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{
  cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);padding:9px 14px;font-weight:600;font-size:13px;
  transition:transform .15s ease, border-color .15s, background .15s, box-shadow .15s;
}
.btn:hover{border-color:#cfcfcf;transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.08)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--brand-red);border-color:transparent;color:#fff}
.btn.primary:hover{background:var(--brand-red-dark);box-shadow:0 8px 22px rgba(227,27,35,.28)}
.btn.ghost{background:transparent}
.btn.tiny{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--brand-red)}
.sep{width:1px;height:28px;background:var(--line);margin:0 2px}

.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.kpi{
  background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:14px 15px 13px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  cursor:pointer;user-select:none;
  transition:transform .15s, border-color .15s, box-shadow .15s;
  animation:rise .55s ease both;
}
.kpi:hover{transform:translateY(-2px);border-color:#cfcfcf;box-shadow:0 10px 28px rgba(0,0,0,.08)}
.kpi.on{
  border-color:rgba(227,27,35,.45);
  box-shadow:0 0 0 2px rgba(227,27,35,.18), var(--shadow);
}
.kpi:nth-child(1){animation-delay:.04s}.kpi:nth-child(2){animation-delay:.08s}
.kpi:nth-child(3){animation-delay:.12s}.kpi:nth-child(4){animation-delay:.16s}
.kpi:nth-child(5){animation-delay:.2s}.kpi:nth-child(6){animation-delay:.24s}
.kpi::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;
  background:var(--line);
}
.kpi.g::before{background:var(--green)}.kpi.a::before{background:var(--amber)}
.kpi.r::before{background:var(--brand-red)}.kpi.b::before{background:var(--sky)}
.kpi .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kpi .val{
  font-size:28px;font-weight:800;letter-spacing:-.03em;
  margin-top:4px;line-height:1.1;font-variant-numeric:tabular-nums;
}
.kpi.g .val{color:var(--green)}.kpi.a .val{color:var(--amber)}.kpi.r .val{color:var(--brand-red)}.kpi.b .val{color:var(--sky)}
.kpi .sub{font-size:11.5px;color:var(--faint);margin-top:3px;font-weight:500}

.controls{
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  background:rgba(255,255,255,.78);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:11px 13px;margin-bottom:16px;box-shadow:var(--shadow);
  animation:rise .55s .12s ease both;
}
.controls input[type=search],.controls select{
  font-size:13px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;
  background:#fff;color:var(--ink);outline:none;transition:border-color .15s, box-shadow .15s;
}
.controls input[type=search]:focus,.controls select:focus{
  border-color:var(--brand-red);box-shadow:0 0 0 3px rgba(227,27,35,.15);
}
.controls input[type=search]{min-width:220px;flex:1 1 220px}
.controls label{
  font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-right:-2px;
}
.filter-chip{
  display:none;align-items:center;gap:8px;
  background:var(--red-dim);border:1px solid rgba(227,27,35,.25);
  color:var(--brand-red);font-size:12px;font-weight:600;
  padding:5px 10px;border-radius:999px;
}
.filter-chip.on{display:inline-flex}
.filter-chip button{
  border:none;background:transparent;color:inherit;cursor:pointer;
  font-weight:800;padding:0 2px;line-height:1;
}
.tabs{display:inline-flex;background:var(--panel-2);border-radius:11px;padding:3px;gap:2px}
.tabs button{
  border:none;background:transparent;padding:7px 14px;border-radius:9px;
  color:var(--muted);box-shadow:none;font-weight:650;font-size:12.5px;cursor:pointer;
  transition:background .15s, color .15s;
}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.spacer{flex:1}

.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
  padding:3px 9px;border-radius:999px;white-space:nowrap;
}
.pill .dot{width:7px;height:7px;border-radius:50%}
.st-green{background:var(--green-dim);color:var(--green)}.st-green .dot{background:var(--green)}
.st-amber{background:var(--amber-dim);color:#9A5E0E}.st-amber .dot{background:var(--amber)}
.st-red{background:var(--red-dim);color:#B53628}.st-red .dot{background:var(--brand-red)}
.st-slate{background:#E8ECED;color:#475569}.st-slate .dot{background:var(--brand-grey)}
.st-blue{background:#E8F0FE;color:#1E4E8C}.st-blue .dot{background:#2B6CB0}
.prio{font-size:11px;font-weight:800;letter-spacing:.04em;padding:2px 7px;border-radius:6px}
.prio.High{background:var(--red-dim);color:#B53628}
.prio.Medium{background:var(--amber-dim);color:#9A5E0E}
.prio.Low{background:#E8ECED;color:#475569}

.panel{
  background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.panel-h{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;border-bottom:1px solid var(--line-soft);
}
.panel-h h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.02em}
.panel-h .hint{font-size:12px;color:var(--faint);font-weight:500}

.dash{
  display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-bottom:14px;
  animation:rise .55s .18s ease both;
}
.dash-side{display:grid;gap:14px}
.health{display:grid;grid-template-columns:140px 1fr;gap:18px;padding:20px;align-items:center}
.ring-wrap{position:relative;width:130px;height:130px;margin:0 auto}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-track{stroke:var(--panel-2);fill:none;stroke-width:12}
.ring-val{
  fill:none;stroke-width:12;stroke-linecap:round;
  stroke:url(#ringGrad);transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1);
}
.ring-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-center strong{font-size:28px;font-weight:800;letter-spacing:-.03em;display:block;line-height:1}
.ring-center span{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.health-copy h3{margin:0 0 6px;font-size:18px;letter-spacing:-.02em}
.health-copy p{margin:0 0 12px;color:var(--muted);font-size:13px}
.stat-row{display:flex;gap:18px;flex-wrap:wrap}
.stat-row div{min-width:70px}
.stat-row b{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-row span{font-size:11px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.05em}

.bars{padding:8px 18px 18px}
.bar-row{display:grid;grid-template-columns:140px 1fr 36px;gap:10px;align-items:center;margin-top:10px}
.bar-row .name{font-size:12.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .track{height:10px;background:var(--panel-2);border-radius:999px;overflow:hidden}
.bar-row .fill{
  height:100%;border-radius:999px;width:0;
  background:linear-gradient(90deg, var(--brand-red), #F03A40);
  transition:width .9s cubic-bezier(.2,.8,.2,1);
}
.bar-row .n{font-size:12px;font-weight:600;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

.feed{padding:4px 0 8px;max-height:320px;overflow:auto}
.feed-item{
  display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;
  padding:11px 18px;border-bottom:1px solid var(--line-soft);
  transition:background .15s;cursor:pointer;
}
.feed-item:last-child{border-bottom:none}
.feed-item:hover{background:#FAFAFA}
.feed-item .badge{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  font-size:10px;font-weight:800;letter-spacing:.02em;
}
.feed-item .badge.warn{background:var(--amber-dim);color:var(--amber)}
.feed-item .badge.late{background:var(--red-dim);color:var(--brand-red)}
.feed-item .badge.soon{background:var(--sky-dim);color:var(--sky)}
.feed-item .t{font-weight:650;font-size:13px}
.feed-item .m{font-size:12px;color:var(--muted);margin-top:2px}
.feed-item .when{font-size:11px;color:var(--faint);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}

.project-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;
  animation:rise .55s .22s ease both;
}
.pcard{
  background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);cursor:pointer;
  transition:transform .2s ease, border-color .2s, box-shadow .2s;
  position:relative;overflow:hidden;
}
.pcard:hover{transform:translateY(-3px);border-color:#cfcfcf;box-shadow:0 16px 40px rgba(0,0,0,.1)}
.pcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:10px}
.pcard h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.pcard .cat{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:500}
.pcard .roles{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.pcard .roles b{color:var(--ink-soft);font-weight:700}
.pcard .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--muted)}
.pcard .prog{height:7px;background:var(--panel-2);border-radius:999px;overflow:hidden;margin-top:12px}
.pcard .prog > i{
  display:block;height:100%;border-radius:999px;width:0;
  background:linear-gradient(90deg, var(--brand-red), #F03A40);
  transition:width .85s cubic-bezier(.2,.8,.2,1);
}
.pcard.done .prog > i{background:linear-gradient(90deg,#111111,#444444)}
.pcard.risk{border-color:rgba(227,27,35,.25)}
.pcard.risk::after{
  content:"";position:absolute;top:-20px;right:-20px;width:70px;height:70px;
  background:radial-gradient(circle, rgba(227,27,35,.15), transparent 70%);
}

.board{
  display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:12px;
  overflow-x:auto;padding-bottom:8px;animation:rise .45s ease both;
}
.col{
  background:rgba(255,255,255,.7);border:1px solid var(--line-soft);border-radius:14px;
  min-width:210px;display:flex;flex-direction:column;max-height:72vh;
  transition:background .15s, border-color .15s;
}
.col.drag-over{background:rgba(227,27,35,.04);border-color:rgba(227,27,35,.35)}
.col-h{
  padding:12px 12px 10px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line-soft);position:sticky;top:0;
  background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-radius:14px 14px 0 0;
}
.col-h strong{font-size:13px;font-weight:700}
.col-h .count{
  font-size:11px;font-weight:700;color:var(--muted);
  background:var(--panel-2);padding:2px 7px;border-radius:999px;font-variant-numeric:tabular-nums;
}
.col-body{padding:10px;display:flex;flex-direction:column;gap:8px;overflow:auto;flex:1;min-height:80px}
.bcard{
  background:#fff;border:1px solid var(--line-soft);border-radius:12px;padding:12px;
  cursor:grab;transition:transform .15s, box-shadow .15s, opacity .15s;
  border-left:3px solid var(--line);
}
.bcard:active{cursor:grabbing}
.bcard.dragging{opacity:.45;transform:scale(.98)}
.bcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.08)}
.bcard .n{font-weight:700;font-size:13px;letter-spacing:-.01em}
.bcard .o{font-size:11.5px;color:var(--muted);margin-top:4px}
.bcard .roles{display:flex;flex-direction:column;gap:2px;margin-top:8px;font-size:11px;color:var(--muted)}
.bcard .roles span b{color:var(--ink-soft);font-weight:700}
.bcard .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.bcard .mini{height:5px;flex:1;background:var(--panel-2);border-radius:999px;overflow:hidden}
.bcard .mini i{display:block;height:100%;background:var(--brand-red);border-radius:999px}
.col[data-status="On Track"] .bcard{border-left-color:var(--green)}
.col[data-status="At Risk"] .bcard{border-left-color:var(--amber)}
.col[data-status="Delayed"] .bcard{border-left-color:var(--brand-red)}
.col[data-status="On Hold"] .bcard,
.col[data-status="Not Started"] .bcard{border-left-color:var(--brand-grey)}
.col[data-status="Completed"] .bcard{border-left-color:var(--brand-black)}

table{width:100%;border-collapse:collapse}
thead th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);
  background:#FAFAFA;position:sticky;top:0;z-index:1;
}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr.proj{cursor:pointer;transition:background .12s}
tbody tr.proj:hover{background:#FAFAFA}
.pname{font-weight:700;letter-spacing:-.01em}
.pcat{font-size:11.5px;color:var(--muted);margin-top:2px}
.chev{display:inline-block;width:14px;transition:.15s;color:var(--muted);font-size:11px}
tr.open .chev{transform:rotate(90deg)}
.bar{position:relative;height:8px;background:var(--panel-2);border-radius:6px;overflow:hidden;min-width:90px}
.bar > i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--brand-red),#F03A40);transition:width .6s ease}
.bar.done > i{background:linear-gradient(90deg,#111111,#444444)}
.pct{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
tr.msrow td{background:#FAFAFA;padding:0}
.ms-inner{padding:6px 14px 12px 44px}
.ms-tab{width:100%;border-collapse:collapse}
.ms-tab td{padding:7px 10px;border-bottom:1px dashed #E4E4E4;font-size:13px;vertical-align:middle}
.ms-tab tr:last-child td{border-bottom:none}
.ms-title{font-weight:600}
.ms-note{font-size:12.5px;color:var(--ink-soft);line-height:1.35;white-space:pre-wrap;max-width:240px}
.ms-kind{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:var(--muted);background:var(--panel-2);padding:2px 6px;border-radius:5px;margin-left:6px;
}
.ms-tab thead th{
  text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);font-weight:700;padding:6px 10px;border-bottom:1px solid var(--line-soft);
  background:transparent;position:static;
}
.ms-add{margin:8px 0 2px;display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:12px}
.right{text-align:right}.center{text-align:center}
.num{font-variant-numeric:tabular-nums}
.empty{padding:48px;text-align:center;color:var(--muted)}

#timeline{padding:8px 0 12px}
.gwrap{overflow-x:auto}
.grid-head{display:flex;border-bottom:1px solid var(--line);position:relative;height:32px;margin-left:240px}
.gmonth{flex:1 0 80px;font-size:11px;color:var(--muted);font-weight:700;text-align:left;padding:8px 0 0 6px;border-left:1px solid var(--line-soft)}
.grow{display:flex;align-items:center;border-bottom:1px solid var(--line-soft);min-height:50px}
.glabel{width:240px;flex:0 0 240px;padding:8px 12px 8px 16px}
.glabel .n{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glabel .o{font-size:11px;color:var(--muted)}
.gtrack{position:relative;flex:1;height:50px}
.gcols{position:absolute;inset:0;display:flex;pointer-events:none}
.gcol{flex:1 0 80px;border-left:1px solid #F0F0F0}
.gbar{
  position:absolute;top:14px;height:22px;border-radius:8px;
  background:#F0F0F0;border:1px solid #D0D0D0;
}
.gbar > i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:linear-gradient(90deg,#222222,#555555);opacity:.95}
.gbar.risk{border-color:rgba(227,27,35,.35);background:#FCE8E9}
.gbar.risk > i{background:linear-gradient(90deg,#C01A20,#E31B23)}
.gbar.done > i{background:linear-gradient(90deg,#111111,#333333)}
.gms{
  position:absolute;top:9px;width:14px;height:14px;transform:translateX(-50%) rotate(45deg);
  border-radius:3px;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.18);cursor:pointer;
  transition:transform .15s;
}
.gms:hover{transform:translateX(-50%) rotate(45deg) scale(1.15)}
.gms.done{background:#111111;border-color:#fff}
.gms.due{background:#9A9A9A;border-color:#fff}
.gms.upc{background:#E31B23;border-color:#fff}
.gms.late{background:#fff;border:2px solid #E31B23;box-shadow:0 0 0 1px #E31B23}
.today-line{position:absolute;top:0;bottom:0;width:2px;background:#E31B23;z-index:3}
.glegend{display:flex;gap:16px;flex-wrap:wrap;padding:12px 16px 4px;font-size:11.5px;color:var(--muted);margin-left:240px}
.glegend span{display:inline-flex;align-items:center;gap:6px}
.lgd{width:11px;height:11px;transform:rotate(45deg);border-radius:2px;display:inline-block;border:1px solid transparent}
.lgd.late{background:#fff;border:2px solid #E31B23;box-sizing:border-box}

.backdrop{
  position:fixed;inset:0;background:rgba(8,8,8,.48);display:none;
  align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto;
  backdrop-filter:blur(4px);
}
.backdrop.on{display:flex}
.modal{
  background:#fff;border-radius:18px;width:100%;max-width:600px;
  box-shadow:0 28px 80px rgba(0,0,0,.3);animation:pop .2s ease;
  border:1px solid rgba(255,255,255,.4);
}
.modal h3{
  margin:0;padding:16px 20px;border-bottom:1px solid var(--line);
  font-size:17px;letter-spacing:-.02em;font-weight:700;
}
.mbody{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.mbody .full{grid-column:1 / -1}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.fld input,.fld select,.fld textarea{
  font-size:13px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
  background:#fff;color:var(--ink);outline:none;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{
  border-color:var(--brand-red);box-shadow:0 0 0 3px rgba(227,27,35,.14);
}
.fld textarea{resize:vertical;min-height:56px}
.mfoot{display:flex;justify-content:space-between;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
.mfoot .l{display:flex;gap:8px}
input[type=range]{accent-color:var(--brand-red)}
.rangewrap{display:flex;align-items:center;gap:10px}
.rangewrap output{font-weight:800;min-width:42px;text-align:right;font-variant-numeric:tabular-nums}
.foot{margin-top:18px;text-align:center;color:var(--faint);font-size:12px}
.hidden{display:none!important}
.view{animation:rise .4s ease both}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(22,163,74,.55)}
  70%{box-shadow:0 0 0 8px rgba(22,163,74,0)}
  100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}
}

@media(max-width:1100px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .dash{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(3,minmax(210px,1fr))}
}
@media(max-width:640px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .mbody{grid-template-columns:1fr}
  .health{grid-template-columns:1fr;text-align:center}
  .stat-row{justify-content:center}
  .glabel{width:160px;flex:0 0 160px}
  .grid-head,.glegend{margin-left:160px}
  .toolbar .btn{padding:8px 11px;font-size:12px}
}
</style>
</head>
<body>
<div class="shell">
  <header class="hero">
    <div class="topbar">
      <div class="brand-mark">
        <div class="logo">
          <img src="/assets/jaffer-logo.png" alt="JAFFER Group of Companies" />
        </div>
        <div class="brand">
          <h1>Jaffer Brothers Group <span class="it">IT</span></h1>
          <p>Projects, tasks &amp; delivery status across the group</p>
          <div class="brand-meta">
            <span class="live"><i></i>Live</span>
          </div>
        </div>
      </div>
      <div class="toolbar">
        <button class="btn primary" onclick="openProject()">+ New Project</button>
        <button class="btn" onclick="openTask()">+ New Task</button>
        <button class="btn" onclick="openMonthly()">+ Monthly Milestone</button>
        <div class="sep"></div>
        <button class="btn ghost" onclick="exportExcel()" title="Download Excel">Excel</button>
      </div>
    </div>
  </header>

  <section class="kpis" id="kpis"></section>

  <div class="controls">
    <input type="search" id="q" placeholder="Search projects, owners, leads, tasks…" oninput="render()">
    <label>Status</label>
    <select id="fStatus" onchange="onFilterChange()">
      <option value="">All</option>
      <option>Not Started</option><option>On Track</option><option>At Risk</option>
      <option>Delayed</option><option>On Hold</option><option>Completed</option>
    </select>
    <label>Owner</label>
    <select id="fOwner" onchange="render()"><option value="">All</option></select>
    <label>Lead</label>
    <select id="fLead" onchange="render()"><option value="">All</option></select>
    <label>Category</label>
    <select id="fCat" onchange="render()"><option value="">All</option></select>
    <label>Priority</label>
    <select id="fPrio" onchange="render()"><option value="">All</option><option>High</option><option>Medium</option><option>Low</option></select>
    <span class="filter-chip" id="kpiFilterChip">
      <span id="kpiFilterLabel"></span>
      <button type="button" onclick="clearKpiFilter()" title="Clear filter">×</button>
    </span>
    <div class="spacer"></div>
    <div class="tabs">
      <button id="tabDashboard" class="on" onclick="setView('dashboard')">Overview</button>
      <button id="tabKanban" onclick="setView('kanban')">Dashboard</button>
      <button id="tabProjects" onclick="setView('projects')">Projects</button>
      <button id="tabTimeline" onclick="setView('timeline')">Timeline</button>
    </div>
  </div>

  <div id="dashboardView" class="view"></div>
  <div id="kanbanView" class="view hidden"></div>
  <div class="panel hidden" id="projectsView">
    <table>
      <thead><tr>
        <th style="width:22%">Project</th>
        <th style="width:10%">Status</th>
        <th style="width:8%">Priority</th>
        <th style="width:11%">Owner</th>
        <th style="width:11%">Lead</th>
        <th style="width:10%">Target</th>
        <th style="width:12%">Progress</th>
        <th style="width:8%" class="center">Tasks</th>
        <th style="width:8%" class="right"></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="emptyState" class="empty hidden">No projects match your filters.</div>
  </div>
  <div class="panel hidden" id="timelineView">
    <div id="timeline"></div>
  </div>

  <p class="foot">Connected to MySQL when available — changes save live. Excel export available for reports. <span id="dbStatus" class="muted"></span></p>
</div>

<!-- Project modal -->
<div class="backdrop" id="projModal">
  <div class="modal">
    <h3 id="projTitle">New Project</h3>
    <div class="mbody">
      <div class="fld full"><label>Project name</label><input id="p_name" placeholder="e.g. GIT Helpdesk module"></div>
      <div class="fld"><label>Category</label>
        <select id="p_cat"></select>
      </div>
      <div class="fld"><label>Owner</label><input id="p_owner" list="ownerList" placeholder="Owner"><datalist id="ownerList"></datalist></div>
      <div class="fld"><label>Lead</label><input id="p_lead" list="leadList" placeholder="Lead"><datalist id="leadList"></datalist></div>
      <div class="fld"><label>Status</label>
        <select id="p_status">
          <option>Not Started</option><option>On Track</option><option>At Risk</option>
          <option>Delayed</option><option>On Hold</option><option>Completed</option>
        </select>
      </div>
      <div class="fld"><label>Priority</label>
        <select id="p_prio"><option>High</option><option>Medium</option><option>Low</option></select>
      </div>
      <div class="fld"><label>Start date</label><input id="p_start" type="date"></div>
      <div class="fld"><label>Target / end date</label><input id="p_end" type="date"></div>
      <div class="fld"><label>Budget (PKR)</label><input id="p_budget" type="text" placeholder="optional"></div>
      <div class="fld"><label>Progress</label>
        <div class="rangewrap"><input id="p_prog" type="range" min="0" max="100" step="5" oninput="p_progOut.value=this.value+'%'"><output id="p_progOut">0%</output></div>
      </div>
      <div class="fld full"><label>Notes</label><textarea id="p_notes" placeholder="Scope, dependencies, risks…"></textarea></div>
    </div>
    <div class="mfoot">
      <div class="l"><button class="btn ghost danger" id="delProjBtn" onclick="deleteProject()">Archive</button></div>
      <div style="display:flex;gap:8px">
        <button class="btn ghost" onclick="closeModal('projModal')">Cancel</button>
        <button class="btn primary" onclick="saveProject()">Save project</button>
      </div>
    </div>
  </div>
</div>

<!-- Task / Monthly milestone modal -->
<div class="backdrop" id="msModal">
  <div class="modal">
    <h3 id="msTitle">New Task</h3>
    <div class="mbody">
      <div class="fld full"><label>Project</label>
        <select id="m_project"></select>
      </div>
      <div class="fld full"><label id="m_titleLabel">Task</label><input id="m_title" placeholder="e.g. Design sign-off"></div>
      <div class="fld"><label>Due date</label><input id="m_due" type="date"></div>
      <div class="fld"><label>Status</label>
        <select id="m_status">
          <option>Not Started</option><option>In Progress</option><option>Completed</option><option>Blocked</option>
        </select>
      </div>
      <div class="fld full"><label>Owner</label><input id="m_owner" placeholder="optional"></div>
      <div class="fld full"><label>Comment / Remark</label><textarea id="m_notes" placeholder="Add a comment or remark…"></textarea></div>
      <input type="hidden" id="m_kind" value="task">
    </div>
    <div class="mfoot">
      <div class="l"><button class="btn ghost danger" id="delMsBtn" onclick="deleteMilestone()">Archive</button></div>
      <div style="display:flex;gap:8px">
        <button class="btn ghost" onclick="closeModal('msModal')">Cancel</button>
        <button class="btn primary" id="msSaveBtn" onclick="saveMilestone()">Save task</button>
      </div>
    </div>
  </div>
</div>

<script>
const CATEGORIES = [
  "Website Support","Website development","Website Security","Infrastructure","Networking",
  "Software development","Automation","Digitization","Documentation","Servers Upgradation",
  "Cloud Servers Management","Licensing"
];

const BOARD_COLS = ["Not Started","On Track","At Risk","Delayed","On Hold","Completed"];
const STATUS_CLASS = {
  "On Track":"st-green","At Risk":"st-amber","Delayed":"st-red",
  "Completed":"st-blue","On Hold":"st-slate","Not Started":"st-slate"
};

let data = [];
let dbOnline = false;
let view = "dashboard";
let openRows = {};
let editingProjectId = null;
let editingMs = { projectId:null, msId:null, kind:"task" };
let kpiFilter = null;
let dragProjectId = null;

const API = "/api/it";
const TODAY = new Date().toISOString().slice(0, 10);
const $ = id => document.getElementById(id);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function uid(prefix="x"){ return prefix + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36); }

(function initCatSelect(){
  $("p_cat").innerHTML = CATEGORIES.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");
})();

function setDbStatus(msg, ok){
  const el = $("dbStatus");
  if(!el) return;
  el.textContent = msg;
  el.style.color = ok === true ? "#0F7A3E" : ok === false ? "#B53628" : "";
}

async function api(path, opts={}){
  const res = await fetch(API + path, {
    headers: { "Content-Type": "application/json", ...(opts.headers||{}) },
    ...opts,
  });
  const body = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(body.error || res.statusText || "Request failed");
  return body;
}

async function loadFromDb(){
  try {
    await api("/health");
    let payload = await api("/projects");
    if (!(payload.projects||[]).length) {
      payload = await api("/seed", { method:"POST", body:"{}" });
    }
    const hasGit = (payload.projects||[]).some(p => String(p.id).startsWith("gp"));
    if (!hasGit) {
      payload = await api("/bootstrap-git", { method:"POST", body:"{}" });
    }
    data = payload.projects || [];
    dbOnline = true;
    setDbStatus(`MySQL · ${data.length} projects`, true);
    render();
  } catch (err) {
    console.error(err);
    dbOnline = false;
    data = data || [];
    setDbStatus("MySQL unavailable — " + err.message, false);
    render();
  }
}

function applyProjects(projects){
  if(Array.isArray(projects)) data = projects;
}

function statusPill(s){
  return `<span class="pill ${STATUS_CLASS[s]||"st-slate"}"><span class="dot"></span>${esc(s)}</span>`;
}
function fmtDate(d){
  if(!d) return "—";
  const p=d.split("-"); if(p.length<3) return d;
  const mm=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return p[2]+" "+mm[+p[1]-1]+" "+p[0];
}
function daysBetween(a,b){ return Math.round((Date.parse(b)-Date.parse(a))/86400000); }

function taskCount(list){
  return list.reduce((s,p)=>s+(p.milestones||[]).length,0);
}

function renderKPIs(){
  const list = filtered(true);
  const t = list.length;
  const tasks = taskCount(list);
  const byStatus = s => list.filter(p=>p.status===s).length;
  const completed = byStatus("Completed");
  const onTrack = byStatus("On Track");
  const atRisk = byStatus("At Risk") + byStatus("On Hold");
  const delayed = byStatus("Delayed");
  const avg = t ? Math.round(list.reduce((s,p)=>s+(+p.progress||0),0)/t) : 0;
  const soon = list.flatMap(p=>p.milestones||[]).filter(m=>m.status!=="Completed" && m.due && daysBetween(TODAY,m.due)>=0 && daysBetween(TODAY,m.due)<=30).length;
  const overdue = list.flatMap(p=>p.milestones||[]).filter(m=>m.status!=="Completed" && m.due && daysBetween(TODAY,m.due)<0).length;

  const tiles = [
    { key:"all", lab:"Active Projects/Tasks", val:t, sub:tasks+" tasks · "+completed+" completed", cls:"" },
    { key:"On Track", lab:"On Track", val:onTrack, sub:"healthy delivery", cls:"g" },
    { key:"risk", lab:"At Risk / Hold", val:atRisk, sub:"needs attention", cls:"a" },
    { key:"Delayed", lab:"Delayed", val:delayed, sub:overdue+" overdue tasks", cls:"r" },
    { key:"progress", lab:"Avg Progress", val:avg+"%", sub:"across projects", cls:"b" },
    { key:"due30", lab:"Due ≤ 30 days", val:soon, sub:"upcoming tasks", cls:"" }
  ];

  $("kpis").innerHTML = tiles.map(k=>{
    const on = kpiFilter===k.key ? "on" : "";
    return `<div class="kpi ${k.cls} ${on}" data-filter="${k.key}" onclick="applyKpiFilter('${k.key}')">
      <div class="lab">${k.lab}</div><div class="val">${k.val}</div><div class="sub">${k.sub}</div>
    </div>`;
  }).join("");

  const chip = $("kpiFilterChip");
  if(kpiFilter && kpiFilter!=="all" && kpiFilter!=="progress"){
    const labels = {
      "On Track":"Filtered: On Track",
      risk:"Filtered: At Risk / On Hold",
      Delayed:"Filtered: Delayed",
      due30:"Filtered: Due ≤ 30 days"
    };
    $("kpiFilterLabel").textContent = labels[kpiFilter] || ("Filtered: "+kpiFilter);
    chip.classList.add("on");
  } else {
    chip.classList.remove("on");
  }
}

function applyKpiFilter(key){
  if(key==="progress" || key==="all"){
    if(kpiFilter===key || key==="all"){ kpiFilter=null; }
    else { kpiFilter=null; }
    if(key==="all"){ clearKpiFilter(false); setView("projects"); return; }
    render();
    return;
  }
  if(kpiFilter===key){ clearKpiFilter(); return; }
  kpiFilter = key;

  if(key==="On Track" || key==="Delayed"){
    $("fStatus").value = key;
  } else if(key==="risk"){
    $("fStatus").value = "";
  } else if(key==="due30"){
    $("fStatus").value = "";
  }

  if(view==="dashboard") setView("kanban");
  else render();
}

function clearKpiFilter(doRender=true){
  kpiFilter = null;
  $("fStatus").value = "";
  if(doRender) render();
}

function onFilterChange(){
  const fs = $("fStatus").value;
  if(kpiFilter==="On Track" || kpiFilter==="Delayed"){
    if(fs !== kpiFilter) kpiFilter = null;
  } else if(kpiFilter==="risk"){
    kpiFilter = null;
  }
  render();
}

function refreshFilterOptions(){
  const owners = [...new Set(data.map(p=>p.owner).filter(Boolean))].sort();
  const leads = [...new Set(data.map(p=>p.lead).filter(Boolean))].sort();
  const cats = [...new Set([...CATEGORIES, ...data.map(p=>p.category).filter(Boolean)])];
  const setOpts = (sel, vals)=>{
    const cur = sel.value;
    sel.innerHTML = '<option value="">All</option>' + vals.map(v=>`<option>${esc(v)}</option>`).join("");
    sel.value = cur;
  };
  setOpts($("fOwner"), owners);
  setOpts($("fLead"), leads);
  setOpts($("fCat"), cats);
  $("ownerList").innerHTML = owners.map(v=>`<option value="${esc(v)}">`).join("");
  $("leadList").innerHTML = leads.map(v=>`<option value="${esc(v)}">`).join("");
}

function filtered(forKpis=false){
  const q = $("q").value.trim().toLowerCase();
  const fs = $("fStatus").value;
  const fo = $("fOwner").value;
  const fl = $("fLead").value;
  const fc = $("fCat").value;
  const fp = $("fPrio").value;

  return data.filter(p=>{
    if(!forKpis){
      if(kpiFilter==="On Track" && p.status!=="On Track") return false;
      if(kpiFilter==="Delayed" && p.status!=="Delayed") return false;
      if(kpiFilter==="risk" && p.status!=="At Risk" && p.status!=="On Hold") return false;
      if(kpiFilter==="due30"){
        const hasSoon = (p.milestones||[]).some(m=>m.status!=="Completed" && m.due && daysBetween(TODAY,m.due)>=0 && daysBetween(TODAY,m.due)<=30);
        if(!hasSoon) return false;
      }
    }
    if(fs && p.status!==fs) return false;
    if(fo && p.owner!==fo) return false;
    if(fl && p.lead!==fl) return false;
    if(fc && p.category!==fc) return false;
    if(fp && p.priority!==fp) return false;
    if(q){
      const hay = (
        p.name+" "+(p.owner||"")+" "+(p.lead||"")+" "+(p.category||"")+" "+(p.notes||"")+" "+
        (p.milestones||[]).map(m=>m.title+" "+(m.notes||"")+" "+(m.owner||"")).join(" ")
      ).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function healthScore(list){
  if(!list.length) return 0;
  let score=0;
  list.forEach(p=>{
    let s = (+p.progress||0) * 0.55;
    if(p.status==="On Track") s += 35;
    else if(p.status==="Completed") s += 45;
    else if(p.status==="At Risk"||p.status==="On Hold") s += 10;
    else if(p.status==="Delayed") s += 0;
    else s += 15;
    if(p.priority==="High" && (p.status==="Delayed"||p.status==="At Risk")) s -= 8;
    score += Math.max(0, Math.min(100, s));
  });
  return Math.round(score/list.length);
}

function renderDashboard(){
  const list = filtered();
  const el = $("dashboardView");
  if(!list.length){
    el.innerHTML = '<div class="panel"><div class="empty">No projects match your filters.</div></div>';
    return;
  }

  const score = healthScore(list);
  const circ = 2*Math.PI*52;
  const offset = circ - (score/100)*circ;
  const allMs = list.flatMap(p=>(p.milestones||[]).map(m=>({...m, project:p.name, pid:p.id})));
  const overdue = allMs.filter(m=>m.status!=="Completed" && m.due && daysBetween(TODAY,m.due)<0).sort((a,b)=>a.due.localeCompare(b.due));
  const soon = allMs.filter(m=>m.status!=="Completed" && m.due && daysBetween(TODAY,m.due)>=0 && daysBetween(TODAY,m.due)<=30).sort((a,b)=>a.due.localeCompare(b.due));
  const blocked = allMs.filter(m=>m.status==="Blocked");

  const byCat = {};
  list.forEach(p=>{ byCat[p.category||"Other"]=(byCat[p.category||"Other"]||0)+1; });
  const catMax = Math.max(...Object.values(byCat),1);
  const catBars = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([name,n])=>`
    <div class="bar-row">
      <div class="name" title="${esc(name)}">${esc(name)}</div>
      <div class="track"><div class="fill" data-w="${(n/catMax)*100}%"></div></div>
      <div class="n">${n}</div>
    </div>`).join("");

  const feedItems = [
    ...blocked.map(m=>({badge:"warn", label:"BLK", title:m.title, meta:m.project, when:fmtDate(m.due), pid:m.pid, mid:m.id})),
    ...overdue.map(m=>({badge:"late", label:"OVD", title:m.title, meta:m.project, when:fmtDate(m.due), pid:m.pid, mid:m.id})),
    ...soon.slice(0,8).map(m=>({badge:"soon", label:"DUE", title:m.title, meta:m.project, when:fmtDate(m.due), pid:m.pid, mid:m.id}))
  ].slice(0,12);

  const feedHtml = feedItems.length ? feedItems.map(f=>`
    <div class="feed-item" onclick="openMs('${f.pid}','${f.mid}')">
      <div class="badge ${f.badge}">${f.label}</div>
      <div><div class="t">${esc(f.title)}</div><div class="m">${esc(f.meta)}</div></div>
      <div class="when">${esc(f.when)}</div>
    </div>`).join("") : `<div class="empty" style="padding:28px">All clear — no blocked, overdue, or upcoming tasks.</div>`;

  const cards = list.slice().sort((a,b)=>{
    const rank = {Delayed:0,"At Risk":1,"On Hold":2,"Not Started":3,"On Track":4,Completed:5};

function onCardDragStart(e, id){
  dragProjectId = id;
  e.dataTransfer.setData("text/plain", id);
  e.dataTransfer.effectAllowed = "move";
  e.currentTarget.classList.add("dragging");
  e.stopPropagation();
}
function onCardDragEnd(e){
  e.currentTarget.classList.remove("dragging");
  document.querySelectorAll(".col.drag-over").forEach(c=>c.classList.remove("drag-over"));
  dragProjectId = null;
}
function onColDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  e.currentTarget.classList.add("drag-over");
}
function onColDragLeave(e){
  if(!e.currentTarget.contains(e.relatedTarget)) e.currentTarget.classList.remove("drag-over");
}
async function onColDrop(e, status){
  e.preventDefault();
  e.currentTarget.classList.remove("drag-over");
  const id = e.dataTransfer.getData("text/plain") || dragProjectId;
  if(!id) return;
  const p = data.find(x=>x.id===id);
  if(!p || p.status===status) return;
  const prev = p.status;
  p.status = status;
  renderKanban();
  try{
    if(dbOnline){
      const out = await api("/projects/"+encodeURIComponent(id), {
        method:"PUT",
        body: JSON.stringify({ ...p, status })
      });
      applyProjects(out.projects);
      render();
    } else {
      render();
    }
  }catch(err){
    p.status = prev;
    alert("Could not update status: " + err.message);
    render();
  }
}

function msCounts(p){

function renderTimeline(){
  const list = filtered();
  const el = $("timeline");
  if(!list.length){ el.innerHTML='<div class="empty">No projects match your filters.</div>'; return; }
  let dates=[];
  list.forEach(p=>{
    if(p.start) dates.push(p.start);
    if(p.end) dates.push(p.end);
    (p.milestones||[]).forEach(m=>{ if(m.due) dates.push(m.due); });
  });
  dates.push(TODAY);
  dates.sort();
  let start = new Date(dates[0]), end = new Date(dates[dates.length-1]);
  start = new Date(start.getFullYear(), start.getMonth(), 1);
  end = new Date(end.getFullYear(), end.getMonth()+1, 0);
  const months=[]; let c=new Date(start);
  while(c<=end){ months.push(new Date(c)); c=new Date(c.getFullYear(),c.getMonth()+1,1); }
  const total = end-start || 1;
  const pos = d => ((new Date(d)-start)/total)*100;
  const MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  let head = `<div class="gwrap"><div class="grid-head">`+
    months.map(m=>`<div class="gmonth">${MN[m.getMonth()]} '${String(m.getFullYear()).slice(2)}</div>`).join("")+
    `</div>`;

  let body = list.map(p=>{
    const s = p.start||p.end||dates[0], e = p.end||p.start||dates[dates.length-1];
    const L = pos(s), W = Math.max(pos(e)-L, 1.2);
    const cols = months.map(()=>'<div class="gcol"></div>').join("");
    const ms = (p.milestones||[]).map(m=>{
      if(!m.due) return "";
      const cls = m.status==="Completed" ? "done"
        : (m.status!=="Completed" && daysBetween(TODAY,m.due)<0 ? "late"
        : (daysBetween(TODAY,m.due)<=30 ? "upc" : "due"));
      const tip = `${m.title} — ${m.status} (due ${fmtDate(m.due)})`;
      return `<div class="gms ${cls}" style="left:${pos(m.due)}%" title="${esc(tip)}" onclick="openMs('${p.id}','${m.id}')"></div>`;
    }).join("");
    const risk = p.status==="Delayed"||p.status==="At Risk";
    const doneBar = p.status==="Completed"||+p.progress===100;
    const barCls = doneBar ? "done" : (risk ? "risk" : "");
    return `<div class="grow">
      <div class="glabel"><div class="n" title="${esc(p.name)}">${esc(p.name)}</div><div class="o">${esc(p.owner||"")} · ${esc(p.lead||"")} · ${esc(p.status)}</div></div>
      <div class="gtrack">
        <div class="gcols">${cols}</div>
        <div class="today-line" style="left:${pos(TODAY)}%"></div>
        <div class="gbar ${barCls}" style="left:${L}%;width:${W}%"><i style="width:${+p.progress||0}%"></i></div>
        ${ms}
      </div></div>`;
  }).join("");

  const legend = `<div class="glegend">
    <span><i class="lgd" style="background:#111111"></i>Completed</span>
    <span><i class="lgd" style="background:#E31B23"></i>Upcoming (≤30d)</span>
    <span><i class="lgd" style="background:#9A9A9A"></i>Future / due</span>
    <span><i class="lgd late"></i>Overdue</span>
    <span><i style="width:12px;height:2px;background:#E31B23;transform:none;border-radius:0" class="lgd"></i>Today (${fmtDate(TODAY)})</span>
  </div>`;
  el.innerHTML = head+body+`</div>`+legend;
}

async function saveProject(){
  const name = $("p_name").value.trim();
  if(!name){ $("p_name").focus(); return; }
  const rec = {
    name,
    category: $("p_cat").value.trim(),
    owner: $("p_owner").value.trim(),
    lead: $("p_lead").value.trim(),
    status: $("p_status").value,
    priority: $("p_prio").value,
    start: $("p_start").value,
    end: $("p_end").value,
    budget: $("p_budget").value.trim(),
    progress: +$("p_prog").value,
    notes: $("p_notes").value.trim()
  };
  try{
    if(dbOnline){
      if(editingProjectId){
        const existing = data.find(x=>x.id===editingProjectId) || {};
        const out = await api("/projects/"+encodeURIComponent(editingProjectId), {
          method:"PUT",
          body: JSON.stringify({ ...existing, ...rec, id: editingProjectId })
        });
        applyProjects(out.projects);
      } else {
        rec.id = uid("p");
        rec.milestones = [];
        const out = await api("/projects", { method:"POST", body: JSON.stringify(rec) });
        applyProjects(out.projects);
        openRows[out.id || rec.id] = true;
      }
    } else {
      if(editingProjectId){
        const p = data.find(x=>x.id===editingProjectId);
        Object.assign(p, rec);
      } else {
        rec.id = uid("p");
        rec.milestones = [];
        data.push(rec);
        openRows[rec.id] = true;
      }
    }
    closeModal("projModal");
    render();
  }catch(err){
    alert("Could not save project: " + err.message);
  }
}

async function deleteProject(){
  if(!editingProjectId) return;
  if(!confirm("Archive this project and its tasks?")) return;
  try{
    if(dbOnline){
      const out = await api("/projects/"+encodeURIComponent(editingProjectId), { method:"DELETE" });
      applyProjects(out.projects);
    } else {
      data = data.filter(x=>x.id!==editingProjectId);
    }
    closeModal("projModal");
    render();
  }catch(err){
    alert("Could not archive project: " + err.message);
  }
}

function openMsModal(projectId, msId, kind){
  if(!data.length){
    alert("Create a project first.");

  editingMs = { projectId: projectId||data[0].id, msId: msId||null, kind };
  const p = data.find(x=>x.id===editingMs.projectId);
  const m = msId ? (p?.milestones||[]).find(x=>x.id===msId) : null;
  const isMonthly = kind === "monthly";

  $("msTitle").textContent = m

    : (isMonthly ? "New Monthly Milestone" : "New Task");

  $("msSaveBtn").textContent = isMonthly ? "Save milestone" : "Save task";

  fillProjectSelect(editingMs.projectId);
  $("m_project").disabled = !!msId;
  $("m_title").value = m ? m.title : "";
  $("m_due").value = m ? (m.due||"") : "";
  $("m_status").value = m ? m.status : "Not Started";
  $("m_owner").value = m ? (m.owner||"") : "";
  $("m_notes").value = m ? (m.notes||"") : "";

async function saveMilestone(){
  const projectId = $("m_project").value || editingMs.projectId;
  const msId = editingMs.msId;
  const p = data.find(x=>x.id===projectId);
  if(!p) return;
  const title = $("m_title").value.trim();
  if(!title){ $("m_title").focus(); return; }
  const kind = $("m_kind").value || "task";
  const rec = {
    title,
    due: $("m_due").value,
    status: $("m_status").value,
    owner: $("m_owner").value.trim(),
    notes: $("m_notes").value.trim(),
    kind
  };
  try{
    if(dbOnline){
      if(msId){
        const out = await api("/milestones/"+encodeURIComponent(msId), {
          method:"PUT",
          body: JSON.stringify({ ...rec, projectId })
        });
        applyProjects(out.projects);
      } else {
        const out = await api("/projects/"+encodeURIComponent(projectId)+"/milestones", {
          method:"POST",
          body: JSON.stringify(rec)
        });
        applyProjects(out.projects);
      }
    } else {
      p.milestones = p.milestones || [];

        rec.id = uid("m");
        p.milestones.push(rec);

    }

    closeModal("msModal");
    render();
  }catch(err){
    alert("Could not save: " + err.message);
  }
}

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(milestoneRows()), "Tasks");
  XLSX.writeFile(wb, "Jaffer-Brothers-Group-IT.xlsx");
}

loadFromDb();
</script>
